name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Tests
        run: PYTHONPATH=src uv run --python ${{ matrix.python-version }} --no-project --with uvicorn --with httpx python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff format
        run: uvx ruff format --check .
      - name: Ruff lint
        run: uvx ruff check .
      - name: Mypy
        run: uvx mypy

  conformance:
    # Runs FastMCP's own deterministic tests against anodize. Needs fastmcp
    # (and therefore Rust), so it runs only here, never on z/OS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Clone FastMCP test suite (pinned)
        run: |
          git clone https://github.com/jlowin/fastmcp /tmp/fastmcp-src
          git -C /tmp/fastmcp-src checkout 3b8538e
      - name: FastMCP's deterministic tests, run against anodize
        run: >
          PYTHONPATH=src:conformance
          uv run --python 3.12
          --with "fastmcp==3.4.2" --with pytest --with pytest-asyncio
          --with opentelemetry-sdk --with opentelemetry-api
          --with dirty-equals --with inline-snapshot
          python -m pytest -p aliasplugin
          /tmp/fastmcp-src/tests/prompts/test_prompt.py
          /tmp/fastmcp-src/tests/resources/test_function_resources.py
          /tmp/fastmcp-src/tests/resources/test_file_resources.py
          /tmp/fastmcp-src/tests/tools/tool/test_output_schema.py
          /tmp/fastmcp-src/tests/server/middleware/test_rate_limiting.py
          /tmp/fastmcp-src/tests/server/middleware/test_timing.py
          -k "not Integration and not Retry" -o asyncio_mode=auto -W ignore
